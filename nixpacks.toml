[phases.setup]
nixPkgs = ["gcc", "zlib", "libGL", "glib", "tesseract"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision",
  "pip install pypdfium2 PyMuPDF",
  "pip install -r requirements.txt",
  "python -c 'import easyocr; easyocr.Reader([\"en\"], gpu=False, model_storage_directory=\"./models/easyocr\", download_enabled=True)'"
]

[start]
cmd = "uvicorn backend.app.main:app --host 0.0.0.0 --port ${PORT:-8000}"

